<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <rect width="500" height="400" fill="none"/>
  <!-- desk -->
  <rect x="80" y="260" width="340" height="12" rx="6" fill="#cbd5e1"/>
  <rect x="120" y="272" width="20" height="80" rx="4" fill="#cbd5e1"/>
  <rect x="360" y="272" width="20" height="80" rx="4" fill="#cbd5e1"/>
  <!-- laptop -->
  <rect x="160" y="160" width="180" height="110" rx="10" fill="#1e293b"/>
  <rect x="168" y="168" width="164" height="94" rx="6" fill="#2563eb"/>
  <!-- screen content lines -->
  <rect x="180" y="185" width="100" height="8" rx="4" fill="#93c5fd"/>
  <rect x="180" y="200" width="70" height="6" rx="3" fill="#60a5fa" opacity=".7"/>
  <rect x="180" y="213" width="120" height="6" rx="3" fill="#60a5fa" opacity=".5"/>
  <rect x="180" y="226" width="80" height="6" rx="3" fill="#60a5fa" opacity=".4"/>
  <!-- keyboard -->
  <rect x="145" y="270" width="210" height="12" rx="6" fill="#334155"/>
  <!-- person -->
  <circle cx="370" cy="160" r="36" fill="#fde68a"/>
  <rect x="340" y="195" width="60" height="80" rx="16" fill="#2563eb"/>
  <rect x="320" y="205" width="24" height="50" rx="10" fill="#fde68a"/>
  <rect x="356" y="205" width="24" height="50" rx="10" fill="#fde68a"/>
  <rect x="340" y="258" width="22" height="50" rx="10" fill="#1e293b"/>
  <rect x="368" y="258" width="22" height="50" rx="10" fill="#1e293b"/>
  <!-- floating card -->
  <rect x="30" y="80" width="140" height="60" rx="12" fill="white" filter="url(#s)"/>
  <circle cx="58" cy="105" r="14" fill="#eff6ff"/>
  <rect x="80" y="97" width="70" height="8" rx="4" fill="#2563eb"/>
  <rect x="80" y="112" width="50" height="6" rx="3" fill="#94a3b8"/>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0001"/>
    </filter>
  </defs>
  <!-- floating badge -->
  <rect x="330" y="60" width="130" height="44" rx="10" fill="white" filter="url(#s)"/>
  <rect x="346" y="74" width="60" height="8" rx="4" fill="#16a34a"/>
  <rect x="346" y="88" width="90" height="6" rx="3" fill="#94a3b8"/>
</svg>
