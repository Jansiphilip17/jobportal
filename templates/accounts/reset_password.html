{% extends 'base.html' %}
{% block title %}Reset Password – JobPortal{% endblock %}
{% block content %}
<div class="auth-page py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card border-0 shadow-sm rounded-4 p-2">
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <i class="bi bi-shield-lock text-primary fs-1"></i>
              <h3 class="fw-800 mt-2 mb-0">Set New Password</h3>
            </div>
            <form method="POST">
              {% csrf_token %}
              <div class="mb-3">
                <label class="form-label fw-600 small">New Password</label>
                {{ form.new_password }}
              </div>
              <div class="mb-4">
                <label class="form-label fw-600 small">Confirm Password</label>
                {{ form.confirm_password }}
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg fw-600">Reset Password</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
