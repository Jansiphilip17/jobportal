<div class="card border-0 shadow-sm rounded-3 mb-3">
  <div class="card-body p-3 text-center">
    {% if user.profile_photo %}
      <img src="{{ user.profile_photo.url }}" class="rounded-circle mb-2" width="64" height="64" style="object-fit:cover;">
    {% else %}
      <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center text-white fw-700 fs-3 mx-auto mb-2" style="width:64px;height:64px;">
        {{ user.first_name|first|upper }}{{ user.last_name|first|upper }}
      </div>
    {% endif %}
    <div class="fw-700 small">{{ user.get_full_name }}</div>
    <div class="text-muted" style="font-size:12px;">{{ user.email }}</div>
  </div>
</div>
<div class="card border-0 shadow-sm rounded-3">
  <div class="list-group list-group-flush rounded-3">
    <a href="{% url 'dashboard:index' %}" class="list-group-item list-group-item-action py-3 small {% if request.resolver_match.url_name == 'index' %}active{% endif %}">
      <i class="bi bi-speedometer2 me-2"></i>Dashboard
    </a>
    <a href="{% url 'candidates:profile' %}" class="list-group-item list-group-item-action py-3 small {% if 'profile' in request.resolver_match.url_name %}active{% endif %}">
      <i class="bi bi-person me-2"></i>My Profile
    </a>
    <a href="{% url 'candidates:resume' %}" class="list-group-item list-group-item-action py-3 small {% if 'resume' in request.resolver_match.url_name %}active{% endif %}">
      <i class="bi bi-file-earmark-text me-2"></i>Resume
    </a>
    <a href="{% url 'applications:my_applications' %}" class="list-group-item list-group-item-action py-3 small {% if 'my_applications' in request.resolver_match.url_name %}active{% endif %}">
      <i class="bi bi-send me-2"></i>My Applications
    </a>
    <a href="{% url 'candidates:saved_jobs' %}" class="list-group-item list-group-item-action py-3 small {% if 'saved_jobs' in request.resolver_match.url_name %}active{% endif %}">
      <i class="bi bi-bookmark me-2"></i>Saved Jobs
    </a>
    <a href="{% url 'accounts:profile_settings' %}" class="list-group-item list-group-item-action py-3 small">
      <i class="bi bi-gear me-2"></i>Settings
    </a>
    <a href="{% url 'accounts:logout' %}" class="list-group-item list-group-item-action py-3 small text-danger">
      <i class="bi bi-box-arrow-right me-2"></i>Logout
    </a>
  </div>
</div>
