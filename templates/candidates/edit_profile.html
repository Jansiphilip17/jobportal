{% extends 'base.html' %}
{% block title %}Edit Profile – JobPortal{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row g-4">
    <div class="col-lg-3">{% include 'dashboard/candidate_sidebar.html' %}</div>
    <div class="col-lg-9">
      <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4">
          <h5 class="fw-700 mb-4">Edit Profile</h5>
          <form method="POST">
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label fw-600 small">Professional Headline</label>
                <input type="text" name="headline" class="form-control" placeholder="e.g., Senior Python Developer | 5 Years Experience" value="{{ profile.headline }}">
              </div>
              <div class="col-12">
                <label class="form-label fw-600 small">About / Summary</label>
                <textarea name="summary" class="form-control" rows="4" placeholder="Write a short summary about yourself...">{{ profile.summary }}</textarea>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-600 small">Date of Birth</label>
                <input type="date" name="dob" class="form-control" value="{{ profile.dob|date:'Y-m-d' }}">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-600 small">Gender</label>
                <select name="gender" class="form-select">
                  <option value="">Select</option>
                  <option value="M" {% if profile.gender == 'M' %}selected{% endif %}>Male</option>
                  <option value="F" {% if profile.gender == 'F' %}selected{% endif %}>Female</option>
                  <option value="O" {% if profile.gender == 'O' %}selected{% endif %}>Other</option>
                  <option value="P" {% if profile.gender == 'P' %}selected{% endif %}>Prefer not to say</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-600 small">Notice Period</label>
                <select name="notice_period" class="form-select">
                  <option value="">Select</option>
                  <option value="immediate" {% if profile.notice_period == 'immediate' %}selected{% endif %}>Immediate</option>
                  <option value="15" {% if profile.notice_period == '15' %}selected{% endif %}>15 Days</option>
                  <option value="30" {% if profile.notice_period == '30' %}selected{% endif %}>1 Month</option>
                  <option value="60" {% if profile.notice_period == '60' %}selected{% endif %}>2 Months</option>
                  <option value="90" {% if profile.notice_period == '90' %}selected{% endif %}>3 Months</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-600 small">Current Company</label>
                <input type="text" name="current_company" class="form-control" value="{{ profile.current_company }}">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-600 small">Current Designation</label>
                <input type="text" name="current_designation" class="form-control" value="{{ profile.current_designation }}">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-600 small">Total Experience (Years)</label>
                <input type="number" name="total_experience" class="form-control" step="0.5" min="0" value="{{ profile.total_experience }}">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-600 small">Current Salary (₹)</label>
                <input type="number" name="current_salary" class="form-control" value="{{ profile.current_salary }}">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-600 small">Expected Salary (₹)</label>
                <input type="number" name="expected_salary" class="form-control" value="{{ profile.expected_salary }}">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-600 small">City</label>
                <input type="text" name="city" class="form-control" value="{{ profile.city }}">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-600 small">State</label>
                <input type="text" name="state" class="form-control" value="{{ profile.state }}">
              </div>
              <div class="col-12">
                <label class="form-label fw-600 small">Preferred Locations</label>
                <input type="text" name="preferred_locations" class="form-control" placeholder="e.g., Bangalore, Chennai, Remote" value="{{ profile.preferred_locations }}">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-600 small">LinkedIn URL</label>
                <input type="url" name="linkedin_url" class="form-control" placeholder="https://linkedin.com/in/..." value="{{ profile.linkedin_url }}">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-600 small">GitHub URL</label>
                <input type="url" name="github_url" class="form-control" placeholder="https://github.com/..." value="{{ profile.github_url }}">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-600 small">Portfolio URL</label>
                <input type="url" name="portfolio_url" class="form-control" value="{{ profile.portfolio_url }}">
              </div>
            </div>
            <div class="mt-4 d-flex gap-2">
              <button type="submit" class="btn btn-primary fw-600 px-4">Save Changes</button>
              <a href="{% url 'candidates:profile' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
