{% extends 'base.html' %}
{% block title %}{% if edu %}Edit{% else %}Add{% endif %} Education – JobPortal{% endblock %}
{% block content %}
<div class="container py-4"><div class="row justify-content-center"><div class="col-md-7">
  <div class="card border-0 shadow-sm rounded-3">
    <div class="card-body p-4">
      <h5 class="fw-700 mb-4">{% if edu %}Edit{% else %}Add{% endif %} Education</h5>
      <form method="POST">
        {% csrf_token %}
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-600 small">Degree <span class="text-danger">*</span></label>
            <input type="text" name="degree" class="form-control" placeholder="e.g., B.Tech, MBA" value="{{ edu.degree }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-600 small">Field of Study</label>
            <input type="text" name="field_of_study" class="form-control" placeholder="e.g., Computer Science" value="{{ edu.field_of_study }}">
          </div>
          <div class="col-12">
            <label class="form-label fw-600 small">Institution <span class="text-danger">*</span></label>
            <input type="text" name="institution" class="form-control" placeholder="University / College name" value="{{ edu.institution }}" required>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-600 small">Start Year</label>
            <input type="number" name="start_year" class="form-control" min="1980" max="2030" value="{{ edu.start_year|default:2020 }}">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-600 small">End Year</label>
            <input type="number" name="end_year" class="form-control" min="1980" max="2030" value="{{ edu.end_year }}">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-600 small">Percentage / CGPA</label>
            <input type="number" name="percentage" class="form-control" step="0.01" max="100" value="{{ edu.percentage }}">
          </div>
          <div class="col-12">
            <div class="form-check">
              <input type="checkbox" name="is_current" class="form-check-input" id="is_current" {% if edu.is_current %}checked{% endif %}>
              <label class="form-check-label small fw-600" for="is_current">Currently studying here</label>
            </div>
          </div>
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary fw-600 px-4">{% if edu %}Update{% else %}Add{% endif %}</button>
          <a href="{% url 'candidates:profile' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div></div></div>
{% endblock %}
