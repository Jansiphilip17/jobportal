{% extends 'base.html' %}
{% block title %}{% if exp %}Edit{% else %}Add{% endif %} Experience – JobPortal{% endblock %}
{% block content %}
<div class="container py-4"><div class="row justify-content-center"><div class="col-md-7">
  <div class="card border-0 shadow-sm rounded-3">
    <div class="card-body p-4">
      <h5 class="fw-700 mb-4">{% if exp %}Edit{% else %}Add{% endif %} Work Experience</h5>
      <form method="POST">
        {% csrf_token %}
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-600 small">Company Name <span class="text-danger">*</span></label>
            <input type="text" name="company_name" class="form-control" value="{{ exp.company_name }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-600 small">Designation / Role <span class="text-danger">*</span></label>
            <input type="text" name="designation" class="form-control" value="{{ exp.designation }}" required>
          </div>
          <div class="col-12">
            <label class="form-label fw-600 small">Location</label>
            <input type="text" name="location" class="form-control" placeholder="City, Country" value="{{ exp.location }}">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-600 small">Start Date</label>
            <input type="date" name="start_date" class="form-control" value="{{ exp.start_date|date:'Y-m-d' }}">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-600 small">End Date</label>
            <input type="date" name="end_date" class="form-control" value="{{ exp.end_date|date:'Y-m-d' }}">
          </div>
          <div class="col-12">
            <div class="form-check">
              <input type="checkbox" name="is_current" class="form-check-input" id="is_current" {% if exp.is_current %}checked{% endif %}>
              <label class="form-check-label small fw-600" for="is_current">I currently work here</label>
            </div>
          </div>
          <div class="col-12">
            <label class="form-label fw-600 small">Description</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Describe your responsibilities and achievements...">{{ exp.description }}</textarea>
          </div>
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary fw-600 px-4">{% if exp %}Update{% else %}Add{% endif %}</button>
          <a href="{% url 'candidates:profile' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div></div></div>
{% endblock %}
