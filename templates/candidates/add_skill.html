{% extends 'base.html' %}
{% block title %}Add Skill – JobPortal{% endblock %}
{% block content %}
<div class="container py-4"><div class="row justify-content-center"><div class="col-md-6">
  <div class="card border-0 shadow-sm rounded-3">
    <div class="card-body p-4">
      <h5 class="fw-700 mb-4">Add Skill</h5>
      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-600 small">Skill Name <span class="text-danger">*</span></label>
          <input type="text" name="skill_name" class="form-control" placeholder="e.g., Python, React, SQL" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label fw-600 small">Proficiency Level</label>
          <select name="proficiency" class="form-select">
            <option value="beginner">Beginner</option>
            <option value="intermediate" selected>Intermediate</option>
            <option value="advanced">Advanced</option>
            <option value="expert">Expert</option>
          </select>
        </div>
        <div class="mb-4">
          <label class="form-label fw-600 small">Years of Experience</label>
          <input type="number" name="years_of_experience" class="form-control" min="0" max="50" value="0">
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary fw-600 px-4">Add Skill</button>
          <a href="{% url 'candidates:profile' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div></div></div>
{% endblock %}
