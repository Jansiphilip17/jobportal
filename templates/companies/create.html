{% extends 'base.html' %}
{% block title %}Create Company – JobPortal{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4">
          <h5 class="fw-700 mb-4"><i class="bi bi-building text-primary me-2"></i>Create Company Profile</h5>
          <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-12"><label class="form-label fw-600 small">Company Name <span class="text-danger">*</span></label><input type="text" name="name" class="form-control" required></div>
              <div class="col-md-6"><label class="form-label fw-600 small">Industry</label><input type="text" name="industry" class="form-control" placeholder="e.g., Information Technology"></div>
              <div class="col-md-6"><label class="form-label fw-600 small">Company Size</label><select name="company_size" class="form-select">
                <option value="">Select</option>
                {% for val, label in size_choices %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
              </select></div>
              <div class="col-md-6"><label class="form-label fw-600 small">Website</label><input type="url" name="website" class="form-control" placeholder="https://"></div>
              <div class="col-md-6"><label class="form-label fw-600 small">Work Email</label><input type="email" name="email" class="form-control"></div>
              <div class="col-md-6"><label class="form-label fw-600 small">City</label><input type="text" name="city" class="form-control"></div>
              <div class="col-md-6"><label class="form-label fw-600 small">State</label><input type="text" name="state" class="form-control"></div>
              <div class="col-12"><label class="form-label fw-600 small">Description</label><textarea name="description" class="form-control" rows="4" placeholder="Tell candidates about your company..."></textarea></div>
              <div class="col-12"><label class="form-label fw-600 small">Company Logo</label><input type="file" name="logo" class="form-control" accept="image/*"></div>
            </div>
            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary fw-600 px-4">Create Company</button>
              <a href="{% url 'dashboard:index' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
